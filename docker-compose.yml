services:
  # Hub domotique : intégrations, automatisations, scènes
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Paris
    network_mode: host
    restart: unless-stopped

  # Portail tablette léger (vieux Safari iOS 9) : http://<serveur>:8124
  portail:
    container_name: portail-tablette
    image: python:3.12-alpine
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./portail:/app:ro
    env_file: .env
    network_mode: host
    restart: unless-stopped
    depends_on:
      - homeassistant
