# ============================================
# HOME ASSISTANT - Configuration principale
# ============================================
# Position, langue et fuseau : réglés dans l'interface
# (Paramètres > Système > Général), stockés dans .storage/core.config.

homeassistant:
  customize: !include customize.yaml

# Intégrations standard (interface, historique, soleil, sauvegardes…)
default_config:

# Le portail tablette (port 8124) passe par localhost
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# ============================================
# IPX800 V3 - LUMIÈRES (relais 1 à 8)
# ============================================
# URLs dans secrets.yaml : ipx800_status_url, ipx800_relay_url

rest_command:
  ipx800_set_relay:
    url: !secret ipx800_relay_url
    method: GET
    username: !secret ipx800_user
    password: !secret ipx800_password
    timeout: 5

# Lecture de l'état des relais toutes les 5 s (cmd=20 = sorties relais)
sensor:
  - platform: rest
    name: ipx800_status
    resource: !secret ipx800_status_url
    username: !secret ipx800_user
    password: !secret ipx800_password
    authentication: basic
    scan_interval: 5
    timeout: 4
    value_template: "OK"
    json_attributes:
      - OUT1
      - OUT2
      - OUT3
      - OUT4
      - OUT5
      - OUT6
      - OUT7
      - OUT8

light:
  - platform: template
    lights:
      salon_principale:
        friendly_name: "Salon"
        unique_id: ipx800_relais_1
        availability_template: "{{ state_attr('sensor.ipx800_status', 'OUT1') is not none }}"
        value_template: "{{ state_attr('sensor.ipx800_status', 'OUT1') | int(0) == 1 }}"
        turn_on:
          service: rest_command.ipx800_set_relay
          data: { relay: 1, state: true }
        turn_off:
          service: rest_command.ipx800_set_relay
          data: { relay: 1, state: false }

      salon_spots:
        friendly_name: "Spots salon"
        unique_id: ipx800_relais_2
        availability_template: "{{ state_attr('sensor.ipx800_status', 'OUT2') is not none }}"
        value_template: "{{ state_attr('sensor.ipx800_status', 'OUT2') | int(0) == 1 }}"
        turn_on:
          service: rest_command.ipx800_set_relay
          data: { relay: 2, state: true }
        turn_off:
          service: rest_command.ipx800_set_relay
          data: { relay: 2, state: false }

      cuisine:
        friendly_name: "Cuisine"
        unique_id: ipx800_relais_3
        availability_template: "{{ state_attr('sensor.ipx800_status', 'OUT3') is not none }}"
        value_template: "{{ state_attr('sensor.ipx800_status', 'OUT3') | int(0) == 1 }}"
        turn_on:
          service: rest_command.ipx800_set_relay
          data: { relay: 3, state: true }
        turn_off:
          service: rest_command.ipx800_set_relay
          data: { relay: 3, state: false }

      chambre:
        friendly_name: "Chambre"
        unique_id: ipx800_relais_4
        availability_template: "{{ state_attr('sensor.ipx800_status', 'OUT4') is not none }}"
        value_template: "{{ state_attr('sensor.ipx800_status', 'OUT4') | int(0) == 1 }}"
        turn_on:
          service: rest_command.ipx800_set_relay
          data: { relay: 4, state: true }
        turn_off:
          service: rest_command.ipx800_set_relay
          data: { relay: 4, state: false }

      salle_de_bain:
        friendly_name: "Salle de bain"
        unique_id: ipx800_relais_5
        availability_template: "{{ state_attr('sensor.ipx800_status', 'OUT5') is not none }}"
        value_template: "{{ state_attr('sensor.ipx800_status', 'OUT5') | int(0) == 1 }}"
        turn_on:
          service: rest_command.ipx800_set_relay
          data: { relay: 5, state: true }
        turn_off:
          service: rest_command.ipx800_set_relay
          data: { relay: 5, state: false }

# Relais 6 à 8 : à affecter (voir docs/PRD.md §4)

# ============================================
# SCÈNES (lumières uniquement tant que volets/TV ne sont pas intégrés)
# ============================================

scene:
  - name: Tout éteindre
    icon: mdi:power-off
    entities:
      light.salon_principale: "off"
      light.salon_spots: "off"
      light.cuisine: "off"
      light.chambre: "off"
      light.salle_de_bain: "off"

  - name: Mode Soirée
    icon: mdi:sofa
    entities:
      light.salon_principale: "on"
      light.salon_spots: "off"
      light.cuisine: "off"
      light.chambre: "off"

  - name: Mode Nuit
    icon: mdi:weather-night
    entities:
      light.salon_principale: "off"
      light.salon_spots: "off"
      light.cuisine: "off"
      light.salle_de_bain: "off"
      light.chambre: "on"

# Les automatisations sont créées au fur et à mesure des intégrations
# (J5). Celles du début visaient des volets et un garage inexistants.
automation: !include automations.yaml

recorder:
  purge_keep_days: 7

logger:
  default: warning
