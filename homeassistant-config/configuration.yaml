# ============================================
# HOME ASSISTANT - Configuration principale
# ============================================
# Position, langue et fuseau : réglés dans l'interface
# (Paramètres > Système > Général), stockés dans .storage/core.config.

homeassistant:
  customize: !include customize.yaml

# Intégrations standard (interface, historique, soleil, sauvegardes…)
default_config:

# Le portail tablette (port 8124) passe par localhost
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# ============================================
# IPX800 V3 - LUMIÈRES (24 relais : 21 câblés, 8 / 23 / 24 libres)
# ============================================
# URLs dans secrets.yaml : ipx800_status_url, ipx800_relay_url

rest_command:
  ipx800_set_relay:
    url: !secret ipx800_relay_url
    method: GET
    username: !secret ipx800_user
    password: !secret ipx800_password
    timeout: 5

# Toutes les commandes de relais passent par ce script en file d'attente (un ordre à la
# fois, ~0,2 s chacun) pour ménager le petit serveur web de l'IPX800.
# NB : l'IPX800 n'a que 24 relais (carte + 2 extensions) ; 25 à 32 n'existent pas.
script:
  ipx800_relais:
    alias: IPX800 - commander un relais
    mode: queued
    max: 64
    fields:
      relay: { description: "N° du relais (1-32)" }
      state: { description: "1 = allumer, 0 = éteindre" }
    sequence:
      - service: rest_command.ipx800_set_relay
        data:
          relay: "{{ relay }}"
          state: "{{ state }}"

# Lecture de l'état des 32 relais toutes les 5 s (cmd=20 = sorties relais)
# Commande : preset.htm?setN=1/0 (l'ancienne syntaxe ledN ne marche que pour 1 à 8)
sensor:
  - platform: rest
    name: ipx800_status
    resource: !secret ipx800_status_url
    username: !secret ipx800_user
    password: !secret ipx800_password
    authentication: basic
    scan_interval: 5
    timeout: 4
    value_template: "OK"
    json_attributes:
      - OUT1
      - OUT2
      - OUT3
      - OUT4
      - OUT5
      - OUT6
      - OUT7
      - OUT8
      - OUT9
      - OUT10
      - OUT11
      - OUT12
      - OUT13
      - OUT14
      - OUT15
      - OUT16
      - OUT17
      - OUT18
      - OUT19
      - OUT20
      - OUT21
      - OUT22
      - OUT23
      - OUT24
      - OUT25
      - OUT26
      - OUT27
      - OUT28
      - OUT29
      - OUT30
      - OUT31
      - OUT32

light:
