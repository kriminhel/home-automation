# ============================================
# DASHBOARD OPTIMISÉ POUR TABLETTE iPad
# Interface tactile avec gros boutons
# ============================================

title: Contrôle Maison
views:
  # ==========================================
  # VUE 1 : PLAN 3D INTERACTIF
  # ==========================================
  - title: Plan 3D
    path: floor3d
    icon: mdi:floor-plan
    panel: true
    badges: []
    cards:
      - type: custom:floor3d-card
        name: Ma Maison 3D
        path: /local/floor3d/
        objfile: maison.obj
        mtlfile: maison.mtl
        backgroundColor: '#F5F5F5'
        header: false
        shadow: false
        extralightmode: false
        globalLightPower: 0.8
        lock_camera: false
        overlay: true
        click: true
        editModeNotifications: true
        camera_position:
          x: 0
          y: 800
          z: 1500
        camera_rotate:
          x: -0.5
          y: 0
          z: 0
        camera_target:
          x: 0
          y: 0
          z: 0
        entities:
          # ==========================================
          # LUMIÈRES - Rendu lumineux 3D
          # ==========================================

          # Salon - Plafonnier principal
          - entity: light.salon_principale
            type3d: light
            object_id: salon_plafonnier
            light:
              lumens: 2000
              color: '#ffffee'
              decay: 1
              distance: 500
              shadow: false

          # Salon - Spots (3 spots liés à la même entité)
          - entity: light.salon_spots
            type3d: light
            object_id: salon_spot_1
            light:
              lumens: 800
              color: '#ffffee'
              decay: 1
              distance: 300
              shadow: false

          - entity: light.salon_spots
            type3d: light
            object_id: salon_spot_2
            light:
              lumens: 800
              color: '#ffffee'
              decay: 1
              distance: 300
              shadow: false

          - entity: light.salon_spots
            type3d: light
            object_id: salon_spot_3
            light:
              lumens: 800
              color: '#ffffee'
              decay: 1
              distance: 300
              shadow: false

          # Cuisine
          - entity: light.cuisine
            type3d: light
            object_id: cuisine_plafonnier
            light:
              lumens: 1500
              color: '#ffffff'
              decay: 1
              distance: 400
              shadow: false

          # Chambre
          - entity: light.chambre
            type3d: light
            object_id: chambre_plafonnier
            light:
              lumens: 1200
              color: '#ffffdd'
              decay: 1
              distance: 400
              shadow: false

          # Salle de bain
          - entity: light.salle_de_bain
            type3d: light
            object_id: sdb_plafonnier
            light:
              lumens: 1000
              color: '#ffffff'
              decay: 1
              distance: 300
              shadow: false

          # ==========================================
          # INTERACTIONS TACTILES (tap = toggle lumière)
          # ==========================================

          - entity: light.salon_principale
            type3d: gesture
            object_id: salon_plafonnier
            gesture:
              domain: light
              service: toggle

          - entity: light.salon_spots
            type3d: gesture
            object_id: salon_spot_1
            gesture:
              domain: light
              service: toggle

          - entity: light.cuisine
            type3d: gesture
            object_id: cuisine_plafonnier
            gesture:
              domain: light
              service: toggle

          - entity: light.chambre
            type3d: gesture
            object_id: chambre_plafonnier
            gesture:
              domain: light
              service: toggle

          - entity: light.salle_de_bain
            type3d: gesture
            object_id: sdb_plafonnier
            gesture:
              domain: light
              service: toggle

          # ==========================================
          # VOLETS ROULANTS
          # ==========================================

          - entity: cover.volet_salon
            type3d: cover
            object_id: volet_salon
            cover:
              pane: volet_salon_panneau
              side: up

          - entity: cover.volet_cuisine
            type3d: cover
            object_id: volet_cuisine
            cover:
              pane: volet_cuisine_panneau
              side: up

          - entity: cover.volet_chambre_1
            type3d: cover
            object_id: volet_chambre_1
            cover:
              pane: volet_chambre_1_panneau
              side: up

          - entity: cover.volet_chambre_2
            type3d: cover
            object_id: volet_chambre_2
            cover:
              pane: volet_chambre_2_panneau
              side: up

          - entity: cover.volet_sdb
            type3d: cover
            object_id: volet_sdb
            cover:
              pane: volet_sdb_panneau
              side: up

          # ==========================================
          # GARAGE
          # ==========================================

          - entity: cover.garage
            type3d: door
            object_id: porte_garage
            door:
              doortype: slide
              side: up
              direction: inner
              degrees: 90

  # ==========================================
  # VUE 2 : ACCUEIL - Vue d'ensemble
  # ==========================================
  - title: Accueil
    path: home
    icon: mdi:home
    badges: []
    cards:
      # Météo et heure
      - type: weather-forecast
        entity: weather.home
        show_forecast: true

      # Scènes rapides
      - type: horizontal-stack
        cards:
          - type: button
            name: Tout éteindre
            icon: mdi:power-off
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.tout_eteindre
            hold_action:
              action: none
            entity: scene.tout_eteindre
            icon_height: 60px
            styles:
              card:
                - height: 120px
                - font-size: 18px

          - type: button
            name: Mode Soirée
            icon: mdi:movie-open
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.mode_soiree
            entity: scene.mode_soiree
            icon_height: 60px

          - type: button
            name: Mode Nuit
            icon: mdi:weather-night
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.mode_nuit
            entity: scene.mode_nuit
            icon_height: 60px

      # Aperçu rapide
      - type: glance
        title: État Général
        show_name: true
        show_state: true
        columns: 4
        entities:
          - entity: light.salon_principale
            name: Salon
          - entity: light.cuisine
            name: Cuisine
          - entity: light.chambre
            name: Chambre
          - entity: cover.volet_salon
            name: Volet Salon
          - entity: cover.volet_chambre
            name: Volet Chambre
          - entity: cover.garage
            name: Garage

  # ==========================================
  # VUE 2 : LUMIÈRES
  # ==========================================
  - title: Lumières
    path: lights
    icon: mdi:lightbulb-multiple
    badges: []
    cards:
      # Salon
      - type: entities
        title: 💡 Salon
        show_header_toggle: true
        entities:
          - entity: light.salon_principale
            name: Lumière Principale
            icon: mdi:ceiling-light
          - entity: light.salon_spots
            name: Spots
            icon: mdi:track-light

      # Cuisine
      - type: entities
        title: 🍳 Cuisine
        show_header_toggle: true
        entities:
          - entity: light.cuisine
            name: Lumière Cuisine
            icon: mdi:ceiling-light

      # Chambre
      - type: entities
        title: 🛏️ Chambre
        show_header_toggle: true
        entities:
          - entity: light.chambre
            name: Lumière Chambre
            icon: mdi:ceiling-light

      # Salle de bain
      - type: entities
        title: 🚿 Salle de Bain
        show_header_toggle: true
        entities:
          - entity: light.salle_de_bain
            name: Lumière SdB
            icon: mdi:ceiling-light

      # Bouton tout éteindre
      - type: button
        name: ⚡ Tout Éteindre
        icon: mdi:lightbulb-off
        tap_action:
          action: call-service
          service: light.turn_off
          service_data:
            entity_id: group.toutes_les_lumieres
        show_state: false
        styles:
          card:
            - height: 100px
            - background-color: '#ff4444'
            - color: white

  # ==========================================
  # VUE 3 : VOLETS ROULANTS (Loratap)
  # ==========================================
  - title: Volets
    path: shutters
    icon: mdi:window-shutter
    badges: []
    cards:
      # Contrôles individuels
      - type: entities
        title: 🪟 Volets Roulants
        show_header_toggle: false
        entities:
          - entity: cover.volet_salon
            name: Volet Salon
            icon: mdi:window-shutter
          - entity: cover.volet_cuisine
            name: Volet Cuisine
            icon: mdi:window-shutter
          - entity: cover.volet_chambre_1
            name: Volet Chambre 1
            icon: mdi:window-shutter
          - entity: cover.volet_chambre_2
            name: Volet Chambre 2
            icon: mdi:window-shutter
          - entity: cover.volet_sdb
            name: Volet SdB
            icon: mdi:window-shutter

      # Boutons actions groupées
      - type: horizontal-stack
        cards:
          - type: button
            name: Tout Ouvrir
            icon: mdi:arrow-up-bold
            tap_action:
              action: call-service
              service: cover.open_cover
              service_data:
                entity_id: all
            icon_height: 60px
            styles:
              card:
                - height: 120px
                - background-color: '#4CAF50'
                - color: white
                - font-size: 20px

          - type: button
            name: Tout Fermer
            icon: mdi:arrow-down-bold
            tap_action:
              action: call-service
              service: cover.close_cover
              service_data:
                entity_id: all
            icon_height: 60px
            styles:
              card:
                - height: 120px
                - background-color: '#2196F3'
                - color: white
                - font-size: 20px

          - type: button
            name: Stop
            icon: mdi:stop
            tap_action:
              action: call-service
              service: cover.stop_cover
              service_data:
                entity_id: all
            icon_height: 60px
            styles:
              card:
                - height: 120px
                - background-color: '#FF9800'
                - color: white
                - font-size: 20px

  # ==========================================
  # VUE 4 : GARAGE (Loratap)
  # ==========================================
  - title: Garage
    path: garage
    icon: mdi:garage
    badges: []
    cards:
      # Contrôle garage
      - type: entities
        title: 🚗 Porte de Garage
        show_header_toggle: false
        entities:
          - entity: cover.garage
            name: Garage
            icon: mdi:garage-variant

      # Grand bouton d'action
      - type: button
        entity: cover.garage
        name: Ouvrir/Fermer Garage
        icon: mdi:garage-open-variant
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        show_state: true
        icon_height: 80px
        styles:
          card:
            - height: 180px
            - font-size: 24px

      # Alerte si garage ouvert
      - type: conditional
        conditions:
          - entity: cover.garage
            state: open
        card:
          type: markdown
          content: |
            # ⚠️ ATTENTION
            ## Le garage est ouvert !
          styles:
            card:
              - background-color: '#ffeb3b'
              - color: '#000'
              - font-size: 20px
              - padding: 20px

  # ==========================================
  # VUE 5 : AUTOMATISATIONS & PARAMÈTRES
  # ==========================================
  - title: Paramètres
    path: settings
    icon: mdi:cog
    badges: []
    cards:
      # Mode vacances
      - type: entities
        title: ⚙️ Modes
        entities:
          - entity: input_boolean.mode_vacances
            name: Mode Vacances
            icon: mdi:beach

      # Automatisations actives
      - type: entities
        title: 🤖 Automatisations
        show_header_toggle: false
        entities:
          - entity: automation.fermer_volets_au_coucher_du_soleil
            name: Fermer volets le soir
          - entity: automation.ouvrir_volets_au_lever_du_soleil
            name: Ouvrir volets le matin
          - entity: automation.tout_eteindre_en_partant
            name: Tout éteindre en partant
          - entity: automation.alerte_garage_ouvert_la_nuit
            name: Alerte garage ouvert

      # Informations système
      - type: entities
        title: 📊 Système
        entities:
          - entity: sensor.ipx800_status
            name: État IPX800
          - entity: sensor.last_boot
            name: Dernier démarrage
