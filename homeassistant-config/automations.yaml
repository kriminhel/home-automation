# ============================================
# AUTOMATISATIONS
# ============================================

# Fermer tous les volets au coucher du soleil
- id: '1'
  alias: Fermer volets au coucher du soleil
  trigger:
    - platform: sun
      event: sunset
      offset: '-00:30:00'  # 30 min avant
  condition: []
  action:
    - service: cover.close_cover
      target:
        entity_id: all
    - service: notify.mobile_app
      data:
        message: "Volets fermés automatiquement"
        title: "Domotique"

# Ouvrir volets au lever du soleil
- id: '2'
  alias: Ouvrir volets au lever du soleil
  trigger:
    - platform: sun
      event: sunrise
      offset: '00:30:00'  # 30 min après
  condition:
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: 'on'  # Seulement les jours de semaine
  action:
    - service: cover.open_cover
      target:
        entity_id: all

# Tout éteindre en partant (détection mobile)
- id: '3'
  alias: Tout éteindre en partant
  trigger:
    - platform: zone
      entity_id: person.vous  # À configurer
      zone: zone.home
      event: leave
  condition: []
  action:
    - service: scene.turn_on
      target:
        entity_id: scene.depart_maison
    - service: notify.mobile_app
      data:
        message: "Lumières éteintes et volets fermés"

# Simulation de présence (mode vacances)
- id: '4'
  alias: Simulation présence - Soir
  trigger:
    - platform: time
      at: '19:30:00'
  condition:
    - condition: state
      entity_id: input_boolean.mode_vacances
      state: 'on'
  action:
    - service: light.turn_on
      target:
        entity_id: light.salon_principale
    - delay: '02:00:00'
    - service: light.turn_off
      target:
        entity_id: light.salon_principale

# Alerte garage ouvert la nuit
- id: '5'
  alias: Alerte garage ouvert la nuit
  trigger:
    - platform: time
      at: '22:00:00'
  condition:
    - condition: state
      entity_id: cover.garage
      state: 'open'
  action:
    - service: notify.mobile_app
      data:
        message: "⚠️ Le garage est encore ouvert !"
        title: "Sécurité"
    - service: tts.google_translate_say
      data:
        entity_id: media_player.google_home
        message: "Attention, le garage est encore ouvert"

# Fermeture automatique garage après 10 min
- id: '6'
  alias: Fermer garage automatiquement
  trigger:
    - platform: state
      entity_id: cover.garage
      to: 'open'
      for: '00:10:00'
  condition:
    - condition: time
      after: '22:00:00'
  action:
    - service: cover.close_cover
      target:
        entity_id: cover.garage
    - service: notify.mobile_app
      data:
        message: "Garage fermé automatiquement"
